<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#1b7a5a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Kannada "ನ" (Na for NammaSahaaya) Stylized Monogram and Chat Bubble -->
  <!-- Outer speech bubble shape -->
  <path d="M120 160 C120 110, 160 80, 256 80 C352 80, 392 110, 392 160 C392 230, 330 280, 260 280 L200 340 L210 280 C150 275, 120 230, 120 160 Z" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Kannada Letter 'ನ' (Na) -->
  <g filter="url(#shadow)">
    <!-- Main Kannada 'ನ' path rendered with high-precision curves -->
    <path d="M190 190 
             C190 160, 215 140, 256 140 
             C295 140, 325 160, 325 195 
             C325 225, 305 245, 275 255 
             C260 260, 250 265, 250 285 
             L250 340
             M250 260
             C290 260, 345 280, 345 330
             C345 375, 300 400, 250 400
             C195 400, 160 365, 160 320
             C160 280, 190 260, 225 260
             C245 260, 255 270, 255 285
             C255 305, 235 320, 215 320" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Decorative top talakattu (accent) -->
    <path d="M220 115 L256 135 L292 115" 
          fill="none" 
          stroke="#e8f1f8" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
